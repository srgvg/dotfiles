# Global mise config. Keep it canonical with `mise-config-fmt` (~/bin), which refuses any
# rewrite that changes meaning.
#
# Every tool has a short name. [tool_alias] maps a name to its backend, grouped by backend, when
# the registry lacks the name or maps it to a different backend; [tools] is one sorted list of
# names. `mise use -g github:owner/repo` writes a long-form key: move it into [tool_alias]
# (mise-config-fmt prints the line to add).
#
# Order in [tools] is not cosmetic: mise builds PATH in that order, so when two tools ship the
# same binary the earlier one wins (e.g. `fd` before `rust`, whose ~/.cargo/bin also holds an fd).

[settings]
always_keep_download          = false
always_keep_install           = true
auto_install                  = true
disable_backends              = ["asdf"]
exec_auto_install             = true
experimental                  = true
fetch_remote_versions_timeout = "25s" # gcloud's version listing is slow
lockfile = true
log_level                     = "error"
paranoid                      = false
# Trust ~/etc so its task runner (mise-tasks/etc/*) runs non-interactively, incl. cron.
# Second entry: kubernetes-platform's agent worktrees, so a fresh one runs `mise run` without a
# per-worktree `mise trust` first (each is a checkout of the already-trusted main repo).
trusted_config_paths          = [
  "~/etc",
  "~/src/teledyne-flir/TDY-MAR-CASC/kubernetes-platform/.claude/worktrees",
]

[settings.github]
credential_command = 'gh auth token --hostname "$MISE_CREDENTIAL_HOST"'

[settings.status]
missing_tools = "always"
show_env      = true
show_tools    = true

[env]
# stable GOBIN so go install'd tools survive Go version upgrades
GOBIN = "{{env.HOME}}/.local/bin"

# Names the registry lacks, or maps to a different backend than the one wanted here.
