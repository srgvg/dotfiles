# Raise the open-file soft limit for the PipeWire daemon.
#
# Debian's systemd user default is 1024 soft / 524288 hard, and the upstream
# pipewire.service sets no LimitNOFILE of its own. PipeWire spends several fds
# (eventfd + memfd) per client connection and does not always release them
# promptly, so a burst of short-lived clients -- a script calling `pactl` in a
# poll loop, or a device that repeatedly appears and vanishes -- can walk the
# daemon into its 1024 ceiling.
#
# The failure mode is silent and total: the daemon stays "active", but every new
# connection is refused with
#
#   mod.protocol-native: server ...: failed to accept: Too many open files
#
# so `pactl` reports "Connection failure: Timeout" and no application can play
# audio, including freshly started ones. Observed 2026-08-03.
#
# See ~/etc/docs/audio-outputs.md.

[Service]
LimitNOFILE=65536
