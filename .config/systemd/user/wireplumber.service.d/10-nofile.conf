# Raise the open-file soft limit for WirePlumber.
#
# Same 1024-fd ceiling as ~/.config/systemd/user/pipewire.service.d/10-nofile.conf,
# but WirePlumber fails differently and far more confusingly: it holds fds for
# every ALSA PCM and every link it manages, so on hitting the limit it starts
# failing to create links and then loses its devices entirely. `pactl list short
# cards` returns nothing, every sink except pure-software ones disappears, and the
# journal fills with
#
#   wp-event-dispatcher: ... link failed: item deactivated before format was set
#   wp-event-dispatcher: ... link failed: some node was destroyed before the link
#                                         was created
#
# The service stays "active" throughout. Observed 2026-08-03, together with the
# same exhaustion in pipewire itself.
#
# See ~/etc/docs/audio-outputs.md.

[Service]
LimitNOFILE=65536
