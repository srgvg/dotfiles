# Delay applied to the desk speakers, in milliseconds, when they are combined with
# the soundbar. One value per remote path, because the Bluetooth link and the TV
# optical path need not lag by the same amount -- as it turns out here they do,
# but keep them separate so either can move on its own.
#
# Sourced by ~/bin/i3-pa-select-output, which writes the matching value into the
# desk_delayed filter chain on every switch. Tune by ear while music with a strong
# transient plays on a combined output:
#
#   audio-delay          show live + saved + which path is active
#   audio-delay +20      nudge until the flam collapses into one sound
#   audio-delay save     persist -- the active path is detected, no need to name it
#
# See ~/etc/docs/audio-outputs.md §4.3.
#
# Tuned by ear on 2026-08-03. First cut was 200/90; both settled at 180. These are
# heard, not measured. Re-tune if a codec, a TV setting or the soundbar's own
# processing mode changes -- nothing here adapts on its own.

DELAY_BT_MS=180
DELAY_TV_MS=100
