# Delay applied to the desk speakers, in milliseconds, when they are combined with
# the soundbar over TV optical. This file is the only place the value is recorded.
#
# Sourced by ~/bin/i3-pa-select-output, which writes it into the desk_delayed filter
# chain on every switch. Tune by ear while music with a strong transient plays on
# the combined output:
#
#   audio-delay          show live + saved
#   audio-delay +20      nudge until the flam collapses into one sound
#   audio-delay save     persist
#
# See ~/etc/docs/audio-outputs.md §4.3.
#
# Heard, not measured. Re-tune if a TV setting or the soundbar's own processing mode
# changes -- nothing here adapts on its own.

DELAY_TV_MS=100
